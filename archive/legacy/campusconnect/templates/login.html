{% extends "base.html" %}
{% block title %}Log in - CampusConnect{% endblock %}
{% block content %}
<div class="card form-card">
    <h1>Welcome back</h1>
    <form method="POST">
        <label>College email</label>
        <input type="email" name="email" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button type="submit">Log in</button>
    </form>
    <p class="switch-link">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</div>
{% endblock %}
