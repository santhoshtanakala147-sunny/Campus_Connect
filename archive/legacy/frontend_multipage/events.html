<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events - CampusConnect</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar" id="app-nav"></nav>

    <main class="container">
        <div class="card">
            <h1>Announce an event</h1>
            <div id="create-flash" class="flash"></div>
            <form id="create-event-form">
                <label for="event-title">Title</label>
                <input type="text" id="event-title" required>
                <label for="event-date">Date</label>
                <input type="date" id="event-date" required>
                <label for="event-description">Description</label>
                <textarea id="event-description" rows="3"></textarea>
                <button type="submit">Create event</button>
            </form>
        </div>

        <div class="card" style="margin-top: 24px;">
            <div class="feed-tabs">
                <button class="tab-btn active" data-scope="college">My college</button>
                <button class="tab-btn" data-scope="all">All colleges</button>
            </div>
            <div id="events-flash" class="flash"></div>
            <div id="events-list" class="list"></div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/notif.js"></script>
    <script src="js/events.js"></script>
</body>
</html>
