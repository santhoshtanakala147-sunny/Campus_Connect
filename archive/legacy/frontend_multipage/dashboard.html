<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - CampusConnect</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar" id="app-nav"></nav>

    <main class="container">
        <div class="welcome-banner">
            <h1 id="welcome">Loading...</h1>
            <p class="subtitle" id="college"></p>
            <div class="stat-row">
                <div class="stat">
                    <div class="stat-number" id="friend-count">-</div>
                    <div class="stat-label">Friends</div>
                </div>
            </div>
        </div>

        <div class="quick-links" id="quick-links"></div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/notif.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
